[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "northflow"
version = "0.1.0"
description = "Small specialist engine for idea → docs → stages → tasks → implementation pipeline"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "click>=8.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
northflow = "northflow.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/northflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
